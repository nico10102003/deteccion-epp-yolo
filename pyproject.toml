[project]
name = "deteccion-epp-yolo"
version = "0.1.0"
description = "Detección de Elementos de Protección Personal en tiempo real con YOLO11n, servido vía gRPC, cliente Streamlit y tracking con MLflow."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Equipo Talos IA - Módulo 3" }
]

dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "streamlit>=1.38.0",
    "streamlit-webrtc>=0.77.0",
    "mlflow>=2.16.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "protobuf>=5.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "src/grpc_service/inference_pb2.py",
    "src/grpc_service/inference_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
