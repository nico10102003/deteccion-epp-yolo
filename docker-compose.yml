services:
  mlflow:
    image: python:3.11-slim
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir mlflow==2.16.0 pyarrow==17.0.0 &&
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/mlruns

  inference:
    build: .
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GRPC_PORT=50051
      - EPP_MODEL_PATH=/app/models/trained/epp_no_compliance_yolo11n_final.pt
    volumes:
      - ./models:/app/models:ro
    ports:
      - "50051:50051"

  streamlit:
    build: .
    command:
      - uv
      - run
      - streamlit
      - run
      - app/detector_epp.py
      - --server.address=0.0.0.0
    depends_on:
      - inference
    environment:
      - GRPC_HOST=inference
      - GRPC_PORT=50051
    ports:
      - "8501:8501"

volumes:
  mlflow_data:
